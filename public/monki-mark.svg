<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Monki</title>
  <description id="description">A compact retro signal monkey mark in electric lime and violet.</description>
  <defs>
    <linearGradient id="signal" x1="12" y1="24" x2="116" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8ff2e"/>
      <stop offset=".48" stop-color="#b8ff2e"/>
      <stop offset=".52" stop-color="#6637e8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="screen" cx="42%" cy="35%" r="72%">
      <stop stop-color="#232b38"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="faceClip"><ellipse cx="64" cy="60" rx="31" ry="29"/></clipPath>
  </defs>
  <style>
    .signal-orbit { transform-origin: 64px 64px; animation: orbit 12s linear infinite; }
    .antenna-dot { transform-origin: 64px 15px; animation: pulse 2.2s ease-in-out infinite; }
    .wink { transform-origin: 78px 55px; animation: blink 5.2s ease-in-out infinite; }
    .cable { stroke-dasharray: 13 8; animation: cable 4s linear infinite; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.82); opacity:.7 } 50% { transform: scale(1.18); opacity:1 } }
    @keyframes blink { 0%,42%,46%,100% { transform: scaleY(1) } 44% { transform: scaleY(.08) } }
    @keyframes cable { to { stroke-dashoffset: -42 } }
    @keyframes scan { 0%,100% { transform: translateY(-28px); opacity:0 } 20%,75% { opacity:.13 } 85% { transform: translateY(62px); opacity:0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="64" cy="64" r="58" fill="url(#screen)" stroke="#303948" stroke-width="2"/>
  <g class="signal-orbit" fill="none" stroke="url(#signal)" stroke-linecap="round">
    <circle cx="64" cy="64" r="53" stroke-width="1.6" stroke-dasharray="7 13" opacity=".9"/>
    <path d="M18 46c6-17 21-29 38-33M110 82c-6 17-21 29-38 33" stroke-width="3" filter="url(#softGlow)"/>
  </g>

  <path d="M64 34V20" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>
  <circle class="antenna-dot" cx="64" cy="15" r="5" fill="#b8ff2e" filter="url(#softGlow)"/>
  <path d="M35 50c-8-8-16-3-16 8s8 17 17 10" fill="#b8ff2e" stroke="#0c0e12" stroke-width="4"/>
  <path d="M93 50c8-8 16-3 16 8s-8 17-17 10" fill="#6637e8" stroke="#0c0e12" stroke-width="4"/>
  <path d="M33 52c0-19 13-32 31-32s31 13 31 32" fill="none" stroke="url(#signal)" stroke-width="6" stroke-linecap="round"/>

  <ellipse cx="64" cy="60" rx="31" ry="29" fill="#f7f4ec" stroke="#0c0e12" stroke-width="4"/>
  <path d="M44 49c0-12 8-20 20-20s20 8 20 20c-6-4-12-6-20-6s-14 2-20 6Z" fill="#111720"/>
  <ellipse cx="50" cy="56" rx="11" ry="13" fill="#fff" stroke="#0c0e12" stroke-width="3"/>
  <ellipse cx="78" cy="56" rx="11" ry="13" fill="#fff" stroke="#0c0e12" stroke-width="3"/>
  <circle cx="51" cy="57" r="4.5" fill="#b8ff2e"/>
  <g class="wink"><circle cx="77" cy="57" r="4.5" fill="#6637e8"/></g>
  <path d="M58 66c2 2 10 2 12 0" fill="none" stroke="#0c0e12" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 72c7 8 21 8 28 0" fill="none" stroke="#0c0e12" stroke-width="3.5" stroke-linecap="round"/>
  <g clip-path="url(#faceClip)">
    <rect class="scan" x="32" y="35" width="64" height="7" fill="url(#signal)"/>
  </g>

  <path class="cable" d="M31 102c7-14 19-14 33 0 14 14 26 14 33 0M31 102c7 14 19 14 33 0 14-14 26-14 33 0" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
</svg>
